parameters:
    # Where the todo list keeps its items: one JSON file, no database
    app.todo_items_file: '%kernel.project_dir%/var/data/todo_items.json'
    # Where the time tracking keeps the periods the timers ran
    app.time_periods_file: '%kernel.project_dir%/var/data/time_periods.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $todoItemsFile: '%app.todo_items_file%'
            string $timePeriodsFile: '%app.time_periods_file%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/Model/'
            - '../src/*/Domain/Exception/'

    # Logs go to var/log/<environment>.log, not to the terminal
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments: ['info', '%kernel.logs_dir%/%kernel.environment%.log']

when@test:
    parameters:
        app.todo_items_file: '%kernel.project_dir%/var/test/todo_items.json'
        app.time_periods_file: '%kernel.project_dir%/var/test/time_periods.json'
