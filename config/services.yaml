parameters:
    # Where each vertical keeps its data: one JSON file each, no database
    app.todo_items_file: '%kernel.project_dir%/var/data/todo_items.json'
    app.time_entries_file: '%kernel.project_dir%/var/data/time_entries.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $todoItemsFile: '%app.todo_items_file%'
            string $timeEntriesFile: '%app.time_entries_file%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/Model/'
            - '../src/*/Domain/Exception/'
            - '../src/*/Facade/Dto/'
            - '../src/*/Facade/SymfonyEvent/'

    # Logs go to var/log/<environment>.log, not to the terminal
    logger:
        class: Symfony\Component\HttpKernel\Log\Logger
        arguments: ['info', '%kernel.logs_dir%/%kernel.environment%.log']

when@test:
    parameters:
        app.todo_items_file: '%kernel.project_dir%/var/test/todo_items.json'
        app.time_entries_file: '%kernel.project_dir%/var/test/time_entries.json'
