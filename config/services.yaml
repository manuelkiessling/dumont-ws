parameters:
    # Where the todo list keeps its items: one JSON file, no database
    app.todo_items_file: '%kernel.project_dir%/var/data/todo_items.json'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $todoItemsFile: '%app.todo_items_file%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/Model/'
            - '../src/*/Domain/Exception/'

when@test:
    parameters:
        app.todo_items_file: '%kernel.project_dir%/var/test/todo_items.json'

    services:
        # Without Monolog, Symfony's logger writes to stderr; the tests log to var/log/test.log instead, so that an
        # error a test provokes on purpose (a 404, say) does not show up in PHPUnit's output
        logger:
            class: Symfony\Component\HttpKernel\Log\Logger
            arguments: ['info', '%kernel.logs_dir%/test.log']
